<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMARTY-MS YAKEEN TEST!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 14px 20px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 18px;
      margin: 0;
    }
    header a {
      color: #38bdf8;
      font-size: 13px;
      text-decoration: none;
      word-break: break-all;
    }
    header a:hover { text-decoration: underline; }
    .frame-wrap {
      flex: 1;
      display: flex;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      min-height: 80vh;
    }
    footer {
      padding: 8px 20px;
      font-size: 12px;
      color: #94a3b8;
      background: #1e293b;
      text-align: center;
    }
    /* Full-screen lock shown if the user tries to leave via back/close */
    #test-closed-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f172a;
      color: #f1f5f9;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    #test-closed-overlay h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    #test-closed-overlay p {
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>YAKEEN TEST!</h1>
    <a href="{{ quuiz_url }}" target="_blank" rel="noopener noreferrer">
      By:MS BRO❤️ {{ quuiz_url }}
    </a>
  </header>

  <div class="frame-wrap" id="frame-wrap">
    <!--
      sandbox intentionally omits "allow-popups" and "allow-top-navigation":
      this blocks the quiz page (and any ads/scripts inside it) from opening
      popups or navigating the parent tab away from this page.
    -->
    <iframe
      id="quiz-frame"
      src="{{ quiz_url }}"
      title="YAKEEN TEST"
      allow="fullscreen"
      referrerpolicy="no-referrer-when-downgrade"
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-presentation">
    </iframe>
  </div>

  <footer>
    Powered By SmartyMS and MR Toxic! Team Toxic❤️‍🩹.
  </footer>

  <div id="test-closed-overlay">
    <h2>TEST CLOSED</h2>
    <p>YOU ARE LEFT THE TEST, SO REOPEN THE TEST LINK AND ATTEND AGAIN FROM STARTING! Powered By: MS BRO❤️‍🩹.</p>
  </div>

  <script>
    // ── 1. Block popups opened from THIS page (belt-and-braces; the iframe
    //    sandbox above already blocks popups originating inside the quiz) ──
    window.open = function () {
      console.warn('Popup blocked.');
      return null;
    };

    // ── 2. Block back navigation. If the user presses Back (or otherwise
    //    triggers a history navigation away from this page), the test is
    //    force-closed: all interaction is locked and we attempt to close
    //    the tab outright. ──
    function lockTest() {
      const frameWrap = document.getElementById('frame-wrap');
      const overlay = document.getElementById('test-closed-overlay');
      frameWrap.style.display = 'none';
      overlay.style.display = 'flex';
      document.title = 'TEST CLOSED!';

      // Try to close the tab. Browsers only allow script-close on tabs that
      // were opened by script, so this may silently fail — in that case the
      // locked "Test Closed" screen above stays up and blocks the test.
      window.close();
      setTimeout(() => { window.close(); }, 50);
    }

    // Seed extra history entries so a single Back press doesn't immediately
    // leave the page — instead it lands back on this page, which triggers
    // the lock.
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function () {
      history.pushState(null, '', location.href);
      lockTest();
    });

    // Also treat an attempted tab close / reload as leaving the test.
    window.addEventListener('beforeunload', function (e) {
      e.preventDefault();
      e.returnValue = '';
    });
  </script>
</body>
</html>

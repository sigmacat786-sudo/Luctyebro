<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE TEST LINK GENERATOR</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- ── STRICT ADMIN LOGIN PORTAL (must pass before generate form shows) ── -->
  <div id="loginGate" class="modal">
    <div class="modal-card gate-card">
      <p class="login-title">STRICT LOGIN PORTAL</p>
      <p class="login-subtitle">Made By: Smarty MS Bro</p>

      <label class="gate-label" for="ownerNameInput">NAME: Enter Website Owner Name Here!</label>
      <input type="text" id="ownerNameInput" class="login-input" autocomplete="off" autocapitalize="off" spellcheck="false">

      <label class="gate-label" for="adminKeyInput">ADMIN KEY: Please Enter Admin Key Here!</label>
      <input type="password" id="adminKeyInput" class="login-input" autocomplete="off" autocapitalize="off" spellcheck="false">

      <label class="gate-label" for="vipKeyInput">VIP KEY: Please Enter Your VIP Key Here!</label>
      <input type="password" id="vipKeyInput" class="login-input" autocomplete="off" autocapitalize="off" spellcheck="false">

      <p id="loginError" class="gate-error hidden"></p>

      <div class="gate-actions">
        <button id="loginBtn" class="btn btn-primary">LOGIN</button>
      </div>

      <p class="login-caption">Only for Education Purpose Live TEST Link System 💙!</p>
    </div>
  </div>

  <!-- ── Link-generate form (hidden until login passes) ──────────────────── -->
  <div id="generateWrapper" class="hidden">
    <div class="page-center">
      <div class="card upload-card">
        <h1 class="brand">LIVE TEST LINK GENERATOR</h1>
        <p class="subtitle">Original link paste karo, Lecture/Quiz name do, link generate karo.</p>

        <form id="generateForm">
          <label class="gate-label" for="originalLinkInput">PASTE YOUR ORIGINAL LINK HERE:</label>
          <input type="text" id="originalLinkInput" class="login-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://...">

          <label class="gate-label" for="lectureNameInput">TEST NAME:</label>
          <input type="text" id="lectureNameInput" class="login-input" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. Units-and-Measurements-03">
          <p class="name-hint">Sirf letters, numbers aur hyphen(-) allowed hai — spaces, special characters aur emojis allowed nahi.</p>
          <p id="nameError" class="gate-error hidden"></p>

          <button type="submit" id="generateBtn" class="btn btn-primary">
            GENERATE LINK ⚡
          </button>
        </form>

        <div id="statusBox" class="status-box hidden"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="{{ url_for('static', filename='js/admin-deter.js') }}"></script>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
